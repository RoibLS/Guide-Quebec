<div class="page">
  <!-- Header de la page (gardé tel quel, juste regroupé le bouton) -->
  <header class="page__header">
    <div class="header-content">
      <h1 class="page__title">Liste des activités</h1>
      <p class="page__subtitle">Restaurants, parcs, aventures et coups de cœur.</p>
    </div>
    
    <!-- Bouton Ajouter déplacé ici pour être aligné à droite du titre -->
    <a routerLink="/activities/new" class="btn-add">
      <span class="icon">+</span> Ajouter
    </a>
  </header>

  <!-- BARRE DE FILTRES -->
  <section class="filters-bar">
    <form [formGroup]="filterForm" class="filters-form">
      
      <!-- Recherche Texte -->
      <div class="filter-group search-group">
        <input type="text" formControlName="search" placeholder="Rechercher (ex: poutine, ski)...">
        <span class="search-icon">🔍</span>
      </div>

      <!-- Selects -->
      <div class="filter-group">
        <select formControlName="region">
          <option value="">Toutes les régions</option>
          <option *ngFor="let r of regions" [value]="r">{{ r }}</option>
        </select>
      </div>

      <div class="filter-group">
        <select formControlName="type">
          <option value="">Tous les types</option>
          <option *ngFor="let t of types" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div class="filter-group">
        <select formControlName="priceRange">
          <option value="">Tous les prix</option>
          <option *ngFor="let p of prices" [value]="p">{{ p }}</option>
        </select>
      </div>
      
      <!-- Bouton Reset (Optionnel) -->
      <button type="button" (click)="filterForm.reset()" class="btn-reset" *ngIf="filterForm.dirty">
        Effacer
      </button>

    </form>
  </section>

  <ng-container *ngIf="!error; else errorTpl">
    <ng-container *ngIf="activities$ | async as activities; else loadingTpl">
      
      <!-- La Grille -->
      <div class="grid">
        <app-activity-card 
          *ngFor="let activity of activities"
          [activity]="activity"
          [showAdminActions]="true" 
          (cardClick)="goToDetail($event)"
          (deleteClick)="onDelete($event)">
        </app-activity-card>
      </div>
    </ng-container>
  </ng-container>

  <ng-template #loadingTpl>
    <div class="state">Chargement des activités…</div>
  </ng-template>

  <ng-template #errorTpl>
    <div class="state state--error">Erreur lors du chargement des activités.</div>
  </ng-template>
</div>
