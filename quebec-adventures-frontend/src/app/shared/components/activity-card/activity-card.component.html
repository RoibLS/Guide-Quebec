<div class="activity-card" (click)="onCardClick()">
  
  <!-- HEADER IMAGE -->
  <div class="activity-card__image-container" (click)="$event.stopPropagation()">
    <app-image-upload 
      [previewUrl]="activity.coverImage" 
      (imageSelected)="onImageSelected($event)">
    </app-image-upload>
    
    <!-- Badges Flottants (Overlay) -->
    <div class="card-overlay-top">
      <span class="badge badge--blur">{{ activityTypeLabel }}</span>
      <span class="badge badge--blur" *ngIf="priceLabel">{{ priceLabel }}</span>
    </div>

    <button 
      class="favorite-btn" 
      (click)="onFavoriteClick($event)"
      [class.active]="activity.isFavorite">
      <span class="heart-icon">{{ activity.isFavorite ? '❤️' : '🤍' }}</span>
    </button>
  </div>

  <!-- BODY CONTENT -->
  <div class="activity-card__content">
    
    <!-- Ligne Titre + Note -->
    <div class="card-header">
      <h3 class="card-title">{{ activity.title }}</h3>
      <div class="rating-pill" *ngIf="activity.rating > 0">
        <span class="star">⭐</span> {{ activity.rating }}
      </div>
    </div>

    <!-- Infos Clés (Grille compacte) -->
    <div class="key-infos">
      <div class="info-item" *ngIf="difficultyLabel" [style.color]="difficultyColor">
        <span class="info-icon">⚡</span> {{ difficultyLabel }}
      </div>
      <div class="info-item">
        <span class="info-icon">⏳</span> {{ durationLabel }}
      </div>
      <div class="info-item">
        <span class="info-icon">📅</span> {{ mainSeason }}
      </div>
    </div>

    <!-- Description -->
    <p class="card-description">{{ activity.description }}</p>

    <!-- Tags (Chips) -->
    <div class="tags-container" *ngIf="activity.tags?.length">
      <span class="tag-chip" *ngFor="let tag of activity.tags.slice(0, 3)">#{{ tag }}</span>
      <span class="tag-chip" *ngIf="activity.tags.length > 3">+{{ activity.tags.length - 3 }}</span>
    </div>

    <!-- Footer Actions -->
    <div class="card-footer" (click)="$event.stopPropagation()">
      
      <!-- Zone Gauche : Localisation -->
      <div class="location-info">
        <div class="city">📍 {{ activity.city }}</div>
        <div class="distance" *ngIf="distanceLabel">{{ distanceLabel }}</div>
      </div>

      <!-- Zone Droite : Actions Externes (Site Web) -->
      <div class="external-actions" *ngIf="!showAdminActions">
        <button *ngIf="activity.website" 
                class="icon-btn" 
                title="Visiter le site web"
                (click)="openExternalLink(activity.website, $event)">
          🌐
        </button>
      </div>

      <!-- Zone Admin (Si activée) -->
      <div class="admin-actions" *ngIf="showAdminActions">
        <a [routerLink]="['/activities', activity.id, 'edit']" class="icon-btn edit" title="Modifier">✏️</a>
        <button (click)="onDelete($event)" class="icon-btn delete" title="Supprimer">🗑️</button>
      </div>

    </div>
  </div>
</div>
